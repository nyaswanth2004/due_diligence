# VeritasIQ – production-oriented Docker Compose.
#
#   cp .env.example .env   # then edit SECRET_KEY and the initial admin password
#   docker compose up -d --build
#
# Services:
#   app     FastAPI + built React SPA, reachable on http://<host>:${APP_PORT}
#   ollama  LLM server, NOT exposed on any host port; app reaches it at
#           http://ollama:11434 (OLLAMA_HOST). Models persist in a volume.

name: veritasiq

services:
  ollama:
    image: ollama/ollama:latest
    container_name: veritasiq-ollama
    restart: always
    volumes:
      - ollama-models:/root/.ollama
    environment:
      # Server listens inside the container; only reachable on the Docker
      # network (no "ports:" mapping, so it is not exposed publicly).
      OLLAMA_HOST: 0.0.0.0:11434
    # Start the server, wait for it to come up, then pull each configured model
    # ONLY if it is not already present (persisted in the ollama-models volume).
    # The /tmp/models-ready marker makes the healthcheck fail until every model
    # is available, so the app container never starts before its model exists.
    # Note: shell "$" is doubled ("$$") so Compose does not interpolate it.
    command: |
      ollama serve &
      set -e
      i=0
      while [ "$$i" -lt 30 ]; do
        if ollama list >/dev/null 2>&1; then
          break
        fi
        i=$$((i+1))
        sleep 1
      done
      for m in ${OLLAMA_MODELS:-qwen2.5:3b}; do
        if ollama show "$$m" >/dev/null 2>&1; then
          echo "[ollama] model $$m already present"
        else
          echo "[ollama] pulling $$m"
          ollama pull "$$m"
        fi
      done
      touch /tmp/models-ready
      echo "[ollama] models ready"
      wait
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/models-ready && ollama list >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 30s

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: veritasiq-app:latest
    container_name: veritasiq-app
    restart: always
    depends_on:
      ollama:
        condition: service_healthy
    ports:
      - "${APP_PORT:-8000}:8000"
    environment:
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env (see .env.example)}
      DEBUG: ${DEBUG:-false}
      # App -> Ollama over the Docker network. Do not change unless Ollama runs elsewhere.
      OLLAMA_HOST: http://ollama:11434
      LLM_BACKEND: ${LLM_BACKEND:-ollama}
      LLM_MODEL: ${LLM_MODEL:-qwen2.5:3b}
      LLM_TEMPERATURE: ${LLM_TEMPERATURE:-0.1}
      QA_MAX_HISTORY: ${QA_MAX_HISTORY:-6}
      LLM_NUM_CTX: ${LLM_NUM_CTX:-8192}
      LLM_NUM_PREDICT: ${LLM_NUM_PREDICT:-600}
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-10m}
      EMBEDDING_BACKEND: ${EMBEDDING_BACKEND:-sentence_transformers}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-BAAI/bge-small-en-v1.5}
      DATABASE_URL: ${DATABASE_URL:-sqlite:////app/data/veritasiq.db}
      STORAGE_BACKEND: ${STORAGE_BACKEND:-local}
      LOCAL_STORAGE_PATH: ${LOCAL_STORAGE_PATH:-/app/data/storage/documents}
      VECTOR_STORE_BACKEND: ${VECTOR_STORE_BACKEND:-local}
      VECTOR_INDEX_PATH: ${VECTOR_INDEX_PATH:-/app/data/storage/vectors}
      VECTOR_DIM: ${VECTOR_DIM:-384}
      HF_HOME: /app/data/hf
      CORS_ORIGINS: ${CORS_ORIGINS:-["http://localhost:8000"]}
      RETRIEVAL_TOP_K: ${RETRIEVAL_TOP_K:-8}
      RETRIEVAL_FUSION_K: ${RETRIEVAL_FUSION_K:-60}
      KEYWORD_ENABLED: ${KEYWORD_ENABLED:-true}
      RERANKER_ENABLED: ${RERANKER_ENABLED:-true}
      RERANKER_MODEL: ${RERANKER_MODEL:-cross-encoder/ms-marco-MiniLM-L-6-v2}
      CHUNK_SIZE: ${CHUNK_SIZE:-1024}
      CHUNK_OVERLAP: ${CHUNK_OVERLAP:-128}
      MAX_UPLOAD_SIZE_MB: ${MAX_UPLOAD_SIZE_MB:-50}
      ALLOWED_EXTENSIONS: ${ALLOWED_EXTENSIONS:-.pdf,.png,.jpg,.jpeg,.xlsx,.xls,.csv}
      OCR_ENGINE: ${OCR_ENGINE:-auto}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-60}
      ADMIN_BOOTSTRAP: ${ADMIN_BOOTSTRAP:-false}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_ROLE: ${ADMIN_ROLE:-admin}
    volumes:
      - app-data:/app/data
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=3).status==200 else 1)"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  app-data:
  ollama-models:

